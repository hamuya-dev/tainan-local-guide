    *,
    *::before,

    html,

      padding: 0;

      color: var(--text);
      font-family: var(--font-sans);

    body {

      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(24px + env(safe-area-inset-bottom, 0px));

    .qr-card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: 0 10px 32px rgba(45, 28, 16, 0.08);
      padding: clamp(24px, 4.5vh, 40px) clamp(20px, 4vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .qr-frame {
      position: relative;
      width: min(78vw, 46dvh, 380px);
      height: min(78vw, 46dvh, 380px);
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid #EFE7DC;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-svg {
      display: block;
      width: 100%;
      height: 100%;
      shape-rendering: crispEdges;
    }

    .qr-logo-wrap {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 18.5%;
      height: 18.5%;
      background: #FFFFFF;
      border-radius: 14px;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
      pointer-events: none;
    }

    .qr-logo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .titles {
      margin: clamp(18px, 3vh, 28px) 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: clamp(6px, 1.1vh, 10px);
      width: 100%;
    }

    .title-ja {
      font-size: clamp(1.3rem, 3.2vw, 1.65rem);
      font-weight: 800;
      line-height: 1.25;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .title-zh {
      font-size: clamp(1.12rem, 2.7vw, 1.38rem);
      font-weight: 700;
      line-height: 1.28;
      color: #3A302A;
    }

    .title-en {
      font-size: clamp(1.02rem, 2.4vw, 1.22rem);
      font-weight: 700;
      line-height: 1.28;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .title-ko {
      font-size: clamp(1rem, 2.3vw, 1.18rem);
      font-weight: 700;
      line-height: 1.28;
      color: var(--text-secondary);
    }

    .scan-hint {
      margin: clamp(16px, 2.6vh, 24px) 0 0;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--primary-soft);
      border: 1px solid #F2C9BC;
      color: #9A331D;
      font-size: clamp(0.8rem, 1.9vw, 0.94rem);
      font-weight: 700;
      line-height: 1.45;
    }

    @media (max-height: 700px) {
      .qr-card {
        padding: 18px 22px;
      }

      .qr-frame {
        width: min(72vw, 42dvh, 300px);
        height: min(72vw, 42dvh, 300px);
        padding: 8px;
      }

      .titles {
        margin-top: 14px;
        gap: 4px;
      }

      .scan-hint {
        margin-top: 12px;
        padding: 8px 14px;
      }
    }
